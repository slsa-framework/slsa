title: SLSA
description: "SLSA: Security framework to ensure software supply chain integrity"
# Keep generated URLs relative (jekyll-github-metadata would otherwise inject
# an absolute url/baseurl, and `jekyll serve` sets url to http://xxx).
url: ""
baseurl: ""
logo: /images/icons/android-chrome-512x512.png
repository: slsa-framework/slsa
collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:title
include:
  - _redirects
exclude:
  - CNAME
  - Gemfile
  - Gemfile.lock
  - Makefile
  - README.md
  - vendor/bundle
goatcounter:
  endpoint: https://slsa.goatcounter.com/count
remote_theme: jekyll/minima@v2.5.1
permalink: :path/:basename
markdown: CommonMarkGhPages
commonmark:
  # UNSAFE needed to support raw HTML
  options: ["SMART", "FOOTNOTES", "UNSAFE"]
  extensions: ["autolink", "strikethrough", "table", "tagfilter"]
titles_from_headings:
  strip_title: true
plugins:
  - jekyll-commonmark-ghpages
  - jekyll-sitemap
  - jekyll-seo-tag
  # Mandatory GitHub Pages plugins:
  - jekyll-coffeescript
  - jekyll-default-layout
  - jekyll-gist
  - jekyll-github-metadata
  - jekyll-optional-front-matter
  - jekyll-paginate
  - jekyll-readme-index
  - jekyll-titles-from-headings
  - jekyll-relative-links
  - jekyll-remote-theme
relative_links:
  collections: true
defaults:
  - scope:
      path: "assets/images"
    values:
      image: true
  - scope:
      path: "spec"
    values:
      layout: "specifications"
  - scope:
      path: "_posts"
    values:
      layout: post
      type: posts
  - scope:
      path: ""
    values:
      # Set the Social image icon
      image: /images/icons/android-chrome-192x192.png
