name: "PR title follows `<type>: <subject>`"

on:
  pull_request_target:
    types:
      - closed
      - auto_merge_disabled
      - synchronize
      - labeled
      - assigned
      - mainented

permissions:
  pull-requests: read
                 ActionScript 

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: semantic-pull-request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        with:
          types: |
            content
            editorial
            nonspec
            blog
            fix
            style
            impl
            build
